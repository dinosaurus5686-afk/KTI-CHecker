<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendamping KTI</title>
<style>
:root{--bg:#160b0a;--card:#24130f;--line:rgba(246,236,217,.10);--fg:#f6ecd9;--muted:#cbb8aa;--faint:#9f877a;--red:#c0302a;--gold:#e2b46a;--ok:#8fe0a7;--warn:#f2c46d;--err:#ff9d93;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 var(--font);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(135deg,#2a0f0d,#4a1512);-webkit-app-region:drag;user-select:none}
.bar img{width:54px;height:auto;flex:none}
.bar .t{flex:1;min-width:0}
.bar b{display:block;font-size:13.5px}
.bar small{display:block;color:#d9b9ab;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8a7a72;margin-right:5px;vertical-align:middle}
.bar .dot.on{background:#5ad17f;box-shadow:0 0 0 3px rgba(90,209,127,.18)}
.ib{-webkit-app-region:no-drag;border:0;background:rgba(246,236,217,.08);width:28px;height:28px;border-radius:8px;font-size:13px;flex:none}
.ib:hover{background:rgba(246,236,217,.18)}
.ib[aria-pressed="true"]{background:var(--gold);color:#1c0f05}
.collapsed .body{display:none}
.body{height:calc(100% - 58px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h3{margin:0 0 6px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:11.5px}
textarea{width:100%;min-height:90px;resize:vertical;background:#140a09;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:12.5px/1.45 var(--font)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--line);background:#1b0f0d;border-radius:10px;padding:7px 11px;font-weight:700;font-size:12.5px}
.btn.gold{background:linear-gradient(180deg,#e2b46a,#a8722f);border-color:transparent;color:#1c0f05}
.btn.red{background:linear-gradient(135deg,#c0302a,#9e1f1a);border-color:transparent;color:#fff}
.btn[disabled]{opacity:.55;cursor:progress}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpi{background:#1b0f0d;border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:center}
.kpi b{display:block;font-size:17px}
.kpi span{font-size:10.5px;color:var(--faint)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.err b{color:var(--err)}
ul.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.refs li{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:10px;padding:8px 10px;background:#1b0f0d}
ul.refs li.ok{border-left-color:#5ad17f} ul.refs li.partial,ul.refs li.similar,ul.refs li.doi_mismatch{border-left-color:#f2b55a} ul.refs li.not_found,ul.refs li.doi_missing,ul.refs li.retracted{border-left-color:#ff5b4f} ul.refs li.wait{border-left-color:#8a7a72}
.st{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:99px;margin-right:6px;background:rgba(246,236,217,.08)}
li.ok .st{background:rgba(90,209,127,.16);color:var(--ok)} li.partial .st,li.similar .st,li.doi_mismatch .st{background:rgba(242,181,90,.16);color:var(--warn)} li.not_found .st,li.doi_missing .st,li.retracted .st{background:rgba(255,91,79,.16);color:var(--err)}
.q{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:rgba(226,180,106,.18);color:var(--gold);margin-left:4px}
.raw{font-size:12px;color:var(--fg);margin-top:4px;word-break:break-word}
.note{font-size:11.5px;color:var(--muted);margin-top:4px}
a{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;background:#1b0f0d}
.chip.err{border-color:rgba(255,91,79,.4);color:var(--err)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(246,236,217,.2);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="refcheck.js"></script>
<script src="companion.js"></script>
</body>
</html>
